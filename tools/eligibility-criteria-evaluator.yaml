name: eligibility-criteria-evaluator
version: 1.0.0
description: "Evaluates patient laboratory biomarker values against inclusion and exclusion criteria"
input_schema:
  type: object
  properties:
    patient_data_json:
      type: string
      description: "JSON string containing patient lab results (egfr, platelets, anc, age)"
  required:
    - patient_data_json
implementation:
  type: script
  path: eligibility_criteria_evaluator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
